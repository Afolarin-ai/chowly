<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">Chowly</span>
    <span class="brand-sub">table-side ordering</span>
  </div>
  <div class="role-switch" role="tablist" aria-label="Switch role">
    <button class="role-btn is-active" data-role="customer" role="tab" aria-selected="true">Customer</button>
    <button class="role-btn" data-role="waiter" role="tab" aria-selected="false">Waiter</button>
  </div>
</header>

<main id="app"></main>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
