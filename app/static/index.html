<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chowly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="scene-photo scene-photo-customer is-active" aria-hidden="true"></div>
<div class="scene-photo scene-photo-waiter" aria-hidden="true"></div>
<div class="scene-glow scene-glow-a" aria-hidden="true"></div>
<div class="scene-glow scene-glow-b" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <svg class="brand-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="16" cy="20" r="10" fill="#F6F0E4" stroke="#211D19" stroke-width="1.8"/>
      <path d="M10.5 11c0 1.9 1.4 2.5 1.4 4.4 0 1.1-.7 1.7-.7 1.7" stroke="#E0952B" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M16 9c0 2.1 1.5 2.8 1.5 5 0 1.2-.8 1.9-.8 1.9" stroke="#E0952B" stroke-width="2.1" stroke-linecap="round"/>
      <path d="M21.5 11c0 1.9-1.4 2.5-1.4 4.4 0 1.1.7 1.7.7 1.7" stroke="#E0952B" stroke-width="2.1" stroke-linecap="round"/>
    </svg>
    <span class="brand-mark">Chowly</span>
    <span class="brand-sub">table-side ordering</span>
  </div>
  <div class="topbar-controls">
    <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.8"/>
        <path d="M12 2.5v2.5M12 19v2.5M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2.5 12H5M19 12h2.5M4.2 19.8L6 18M18 6l1.8-1.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="role-switch" role="tablist" aria-label="Switch role">
      <span class="role-switch-thumb" data-role-thumb></span>
      <button class="role-btn is-active" data-role="customer" role="tab" aria-selected="true">Customer</button>
      <button class="role-btn" data-role="waiter" role="tab" aria-selected="false">Waiter</button>
    </div>
  </div>
</header>

<main id="app"></main>

<div id="toast" class="toast" aria-live="polite"></div>
<div id="print-area"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
